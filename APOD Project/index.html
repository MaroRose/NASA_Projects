<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" 
          content="width=device-width,
                   initial-scale=1.0" />

       <title>p5.js 3D Model</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  </head>

  <body>
  
    <button id="fetchButton">Fetch NASA Image</button>
<img id="apodImage" src="" alt="NASA APOD" />


    <script src="main_sketch_1.js"></script>

    <script>

     const apiKey = "cfriGOTqNd3Xu2tGEdkqZHSh2srC07xXrjwl2QfZ";

document.getElementById("fetchButton").addEventListener("click", () => {
  fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}`)
    .then((response) => response.json())
    .then((data) => {
      document.getElementById("apodImage").src = data.url;
      document.getElementById("apodImage").alt = data.title;
      console.log(data);
    })
    .catch((error) => {
      console.error("Fetch failed:", error);
    });
});
    </script>
    
  </body>
</html>
